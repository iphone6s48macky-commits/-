<title>Kinetic Core MK-VII</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A 36-second mechanical motion graphic: gear train, exploded core stack, iris aperture, hydraulic actuators and title assembly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500&text=%E5%85%A8%E9%A7%86%E5%8B%95%E7%B3%BB%E3%80%81%E8%B5%B7%E5%8B%95%E5%AE%8C%E4%BA%86%E3%80%82&display=swap">
<style>
/* Layout: one full-bleed canvas stage; a thin transport bar docks at the bottom and hides when idle. */
:root {
  --bg: #05080c;      /* gunmetal black, blue-biased */
  --plate: #0b131b;   /* machined plate fill */
  --steel: #6f879b;   /* secondary linework */
  --line: #c4e8ff;    /* primary linework, cold white */
  --ink: #f1f7fc;     /* hottest highlight */
  --hot: #ffad1f;     /* safety amber accent */
  --display: "Chakra Petch", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--line); overflow: hidden; font-family: var(--mono); }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }

.ui {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding-block: 18px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, color-mix(in srgb, var(--bg) 92%, transparent), transparent);
  transition: opacity .5s ease, transform .5s ease;
}
.ui.idle { opacity: 0; transform: translateY(8px); pointer-events: none; }
.ui button {
  font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--line); background: color-mix(in srgb, var(--plate) 80%, transparent);
  border: 1px solid color-mix(in srgb, var(--steel) 55%, transparent);
  padding: 9px 12px; min-height: 34px; cursor: pointer; white-space: nowrap;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}
.ui button:hover { border-color: var(--line); color: var(--ink); }
.ui button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.ui button.hot { color: var(--bg); background: var(--hot); border-color: var(--hot); animation: pulse 1.6s ease-in-out infinite; }
.ui button.hot:hover { color: var(--bg); }
@keyframes pulse { 50% { box-shadow: 0 0 18px color-mix(in srgb, var(--hot) 70%, transparent); } }
.scrub { position: relative; flex: 1 1 auto; min-width: 0; height: 34px; display: flex; align-items: center; }
.scrub input { width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; height: 34px; cursor: pointer; }
.scrub input::-webkit-slider-runnable-track { height: 2px; background: color-mix(in srgb, var(--steel) 60%, transparent); }
.scrub input::-moz-range-track { height: 2px; background: color-mix(in srgb, var(--steel) 60%, transparent); }
.scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 4px; height: 18px; margin-top: -8px; background: var(--hot); border: 0; }
.scrub input::-moz-range-thumb { width: 4px; height: 18px; background: var(--hot); border: 0; border-radius: 0; }
.scrub input:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.marks { position: absolute; inset: 0; pointer-events: none; }
.marks span { position: absolute; top: 4px; transform: translateX(-1px); font: 500 9px/1 var(--mono); letter-spacing: .1em; color: var(--steel); border-left: 1px solid var(--steel); padding: 0 0 12px 4px; }
.tc { font: 500 11px/1 var(--mono); color: var(--steel); font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
@media (max-width: 560px) {
  .marks span { font-size: 0; padding-right: 0; }
  .tc, #fs { display: none; }
  .ui { gap: 6px; }
  .ui button { padding: 9px 9px; letter-spacing: .08em; }
}
</style>

<canvas id="stage" role="img" aria-label="Kinetic Core MK-VII: a mechanical motion graphic. Gears mesh, a core stack collapses, an iris opens, actuators lock and the title assembles."></canvas>

<div class="ui" id="ui">
  <button id="play" type="button" aria-pressed="true">Pause</button>
  <button id="restart" type="button">Restart</button>
  <div class="scrub">
    <input id="scrub" type="range" min="0" max="36000" step="1" value="0" aria-label="Timeline">
    <div class="marks" id="marks"></div>
  </div>
  <span class="tc" id="tc">00.0 / 36.0</span>
  <button id="snd" class="hot" type="button" aria-pressed="false">Sound on</button>
  <button id="fs" type="button">Full</button>
</div>

<script>
(() => {
'use strict';

/* ---------- tokens ---------- */
const css = getComputedStyle(document.documentElement);
const tok = n => { const h = css.getPropertyValue(n).trim().replace('#', ''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const cBG = tok('--bg'), cPLATE = tok('--plate'), cSTEEL = tok('--steel'), cLINE = tok('--line'), cINK = tok('--ink'), cHOT = tok('--hot');
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a < 0 ? 0 : a > 1 ? 1 : a})`;
const F_MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
const F_DISP = '"Chakra Petch", "Arial Narrow", sans-serif';
const F_JP = '"Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif';

/* ---------- math ---------- */
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eOC = x => 1 - Math.pow(1 - x, 3);
const eIC = x => x * x * x;
const eIOC = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOX = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOB = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function kf(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) { const a = keys[i-1], b = keys[i]; return a[1] + (b[1] - a[1]) * eIOC((t - a[0]) / (b[0] - a[0])); }
  }
  return keys[keys.length - 1][1];
}

/* ---------- canvas ---------- */
const T = 36;
const C = document.getElementById('stage'), ctx = C.getContext('2d');
const G1 = document.createElement('canvas'), g1 = G1.getContext('2d');
const G2 = document.createElement('canvas'), g2 = G2.getContext('2d');
const VIG = document.createElement('canvas');
const hasFilter = typeof ctx.filter === 'string';
let W = 0, H = 0, DPR = 1, S = 1, CX = 0, CY = 0, scanPat = null, grain = [];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  C.width = Math.round(W * DPR); C.height = Math.round(H * DPR);
  G1.width = Math.max(1, Math.ceil(C.width / 4)); G1.height = Math.max(1, Math.ceil(C.height / 4));
  G2.width = Math.max(1, Math.ceil(C.width / 10)); G2.height = Math.max(1, Math.ceil(C.height / 10));
  S = Math.min(W, H) / 1000; CX = W / 2; CY = H / 2;
  VIG.width = C.width; VIG.height = C.height;
  const v = VIG.getContext('2d');
  const gr = v.createRadialGradient(C.width/2, C.height/2, Math.min(C.width, C.height) * .25, C.width/2, C.height/2, Math.hypot(C.width, C.height) * .62);
  gr.addColorStop(0, rgba(cBG, 0)); gr.addColorStop(1, rgba(cBG, .88));
  v.fillStyle = gr; v.fillRect(0, 0, C.width, C.height);
  const sc = document.createElement('canvas'); sc.width = 4; sc.height = Math.max(3, Math.round(3 * DPR));
  const sx = sc.getContext('2d'); sx.fillStyle = 'rgba(0,0,0,0.22)'; sx.fillRect(0, 0, 4, Math.max(1, Math.round(DPR)));
  scanPat = ctx.createPattern(sc, 'repeat');
  if (!grain.length) {
    for (let k = 0; k < 3; k++) {
      const n = document.createElement('canvas'); n.width = n.height = 128;
      const nx = n.getContext('2d'), id = nx.createImageData(128, 128);
      for (let i = 0; i < id.data.length; i += 4) { const v2 = Math.random() * 255; id.data[i] = id.data[i+1] = id.data[i+2] = v2; id.data[i+3] = 18; }
      nx.putImageData(id, 0, 0); grain.push(ctx.createPattern(n, 'repeat'));
    }
  }
}
window.addEventListener('resize', resize);
resize();

/* ---------- camera / projection ---------- */
const K_ZOOM = [[0,2.1],[3.5,1.5],[5.2,1.35],[7.6,0.98],[10.5,0.95],[13.4,0.86],[17.6,0.86],[19,1.08],[21.6,0.98],[24.8,0.6],[26.5,0.64],[33,0.74],[36,0.74]];
const K_TILT = [[0,0],[8,0],[10.5,-0.95],[12,-0.85],[13.4,-1.12],[17.6,-1.0],[19,0],[25.8,0],[31,-0.62],[36,-0.62]];
const K_AZ   = [[0,0],[8,0],[12,0.75],[17.6,1.9],[19,2.36],[25.8,2.36],[36,2.9]];
const K_ROLL = [[0,0],[10.5,0],[13,0.1],[17.6,-0.06],[19,0],[36,0]];
const IMPACTS = [[17.6, 1], [28.3, 1], [21.0, .35], [24.4, .3]];
const camD = 2400;
let cA = 1, sA = 0, cT = 1, sT = 0, cR = 1, sR = 0, SZ = 1, ox = 0, oy = 0, _x = 0, _y = 0, _k = 1;
const cam = { az: 0, tilt: 0, zoom: 1 };
function setCam(t, shake = true) {
  const az = kf(K_AZ, t), ti = kf(K_TILT, t), ro = kf(K_ROLL, t);
  let z = kf(K_ZOOM, t), sh = 0;
  for (const [it, amp] of IMPACTS) { const d = t - it; if (d >= 0 && d < 1.5) { z *= 1 + .05 * amp * Math.exp(-d * 6); sh += amp * Math.exp(-d * 7); } }
  for (const g of GEARS) { if (g.p >= 0) { const d = t - g.ap - .45; if (d >= 0 && d < .6) sh += .12 * Math.exp(-d * 10); } }
  cA = Math.cos(az); sA = Math.sin(az); cT = Math.cos(ti); sT = Math.sin(ti); cR = Math.cos(ro); sR = Math.sin(ro);
  SZ = S * z; ox = CX; oy = CY;
  if (shake && sh > .001) { const a = sh * 16 * S; ox += a * (Math.sin(t * 97.3) + .5 * Math.sin(t * 41.1)); oy += a * (Math.cos(t * 83.7) + .5 * Math.sin(t * 57.9)); }
  cam.az = az; cam.tilt = ti; cam.zoom = z;
}
function P(x, y, z) {
  const x1 = x * cA - y * sA, y1 = x * sA + y * cA;
  const y2 = y1 * cT - z * sT, z2 = y1 * sT + z * cT;
  const x3 = x1 * cR - y2 * sR, y3 = x1 * sR + y2 * cR;
  const k = camD / (camD + z2); _k = k; _x = ox + x3 * k * SZ; _y = oy + y3 * k * SZ;
}
function circ(cx, cy, z, r, n = 96) {
  for (let i = 0; i <= n; i++) { const a = i / n * TAU; P(cx + r * Math.cos(a), cy + r * Math.sin(a), z); i ? ctx.lineTo(_x, _y) : ctx.moveTo(_x, _y); }
  ctx.closePath();
}
function arc(cx, cy, z, r, a0, a1, n, move = true) {
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; P(cx + r * Math.cos(a), cy + r * Math.sin(a), z); (i === 0 && move) ? ctx.moveTo(_x, _y) : ctx.lineTo(_x, _y); }
}

/* ---------- geometry: gear train ---------- */
const M = 10; // module, mm
const GEARS = [
  { N: 36, p: -1, phi: 0,          th: 46, ap: 3.6,  holes: 6, name: 'G1' },
  { N: 18, p: 0,  phi: 0,          th: 34, ap: 5.0,  holes: 0, name: 'G2' },
  { N: 24, p: 0,  phi: 150 * D2R,  th: 38, ap: 5.55, holes: 5, name: 'G3' },
  { N: 12, p: 1,  phi: -70 * D2R,  th: 28, ap: 6.1,  holes: 0, name: 'G4' },
  { N: 30, p: 0,  phi: 250 * D2R,  th: 42, ap: 6.65, holes: 6, name: 'G5' },
  { N: 16, p: 2,  phi: 95 * D2R,   th: 30, ap: 7.2,  holes: 0, name: 'G6' },
];
for (const g of GEARS) {
  const N = g.N, r = M * N / 2, ro = r + M, rr = r - 1.25 * M, p = TAU / N, pts = [];
  for (let k = 0; k < N; k++) { const a = k * p; pts.push(rr, a - .5 * p, rr, a - .28 * p, ro, a - .12 * p, ro, a + .12 * p, rr, a + .28 * p); }
  Object.assign(g, { poly: new Float32Array(pts), r, ro, rr, hub: rr * .34, bore: rr * .15, rim: rr * .84, th0: 0, w: 0 });
  if (g.p < 0) { g.x = 0; g.y = 0; }
  else { const q = GEARS[g.p], d = M * (q.N + N) / 2; g.x = q.x + d * Math.cos(g.phi); g.y = q.y + d * Math.sin(g.phi); }
}
function gearOutline(g, X, Y, Z, th, sc) {
  const pl = g.poly; let len = 0, lx = 0, ly = 0, fx = 0, fy = 0;
  for (let i = 0; i < pl.length; i += 2) {
    const r = pl[i] * sc, a = pl[i+1] + th; P(X + r * Math.cos(a), Y + r * Math.sin(a), Z);
    if (i === 0) { ctx.moveTo(_x, _y); fx = _x; fy = _y; } else { ctx.lineTo(_x, _y); len += Math.hypot(_x - lx, _y - ly); }
    lx = _x; ly = _y;
  }
  ctx.closePath(); return len + Math.hypot(fx - lx, fy - ly);
}
function gearHoles(g, X, Y, Z, th, sc) {
  if (g.holes) {
    const hr = (g.rim - g.hub) * .36 * sc, hm = (g.rim + g.hub) / 2 * sc;
    for (let i = 0; i < g.holes; i++) { const a = th + i * TAU / g.holes + Math.PI / g.N; circ(X + hm * Math.cos(a), Y + hm * Math.sin(a), Z, hr, 28); }
  }
  circ(X, Y, Z, g.bore * sc, 32);
}

/* ---------- geometry: core stack ---------- */
const RINGS = [
  { r: 70,  w: 20, ty: 'bolts', n: 6,   d: 1 },
  { r: 118, w: 24, ty: 'teeth', n: 40,  d: -1, label: ['R-02  SUN RING', '40T · m6'] },
  { r: 168, w: 14, ty: 'ticks', n: 72,  d: 1 },
  { r: 226, w: 32, ty: 'slots', n: 12,  d: -1, label: ['R-04  SLOT CARRIER', '12 × 18°'] },
  { r: 292, w: 16, ty: 'ticks', n: 120, d: 1 },
  { r: 352, w: 26, ty: 'teeth', n: 90,  d: -1, label: ['R-06  OUTER RACE', '90T · Ø704'] },
  { r: 428, w: 22, ty: 'segs',  n: 24,  d: 1, label: ['R-07  SEGMENT CROWN', '24 × 15°'] },
];

/* ---------- title glyphs (4 × 6 grid, beams) ---------- */
const GLYPH = {
  K: [[0,0,0,6],[0.25,3.45,3.6,0],[1.45,2.35,3.6,6]],
  I: [[0.3,0,3.3,0],[1.8,0,1.8,6],[0.3,6,3.3,6]],
  N: [[0,0,0,6],[0,0,3.6,6],[3.6,0,3.6,6]],
  E: [[0,0,0,6],[0,0,3.6,0],[0,3,2.7,3],[0,6,3.6,6]],
  T: [[0,0,3.6,0],[1.8,0,1.8,6]],
  C: [[3.6,0,0,0],[0,0,0,6],[0,6,3.6,6]],
};
const WORD = 'KINETIC', LW = 3.6, LG = 1.5, WORDW = WORD.length * LW + (WORD.length - 1) * LG;
const STROKES = [];
[...WORD].forEach((ch, li) => GLYPH[ch].forEach(s => STROKES.push({ x1: s[0] + li * (LW + LG), y1: s[1], x2: s[2] + li * (LW + LG), y2: s[3] })));
STROKES.forEach((s, j) => { s.st = 25.9 + j * .085; s.land = s.st + .42; s.sign = (j % 2) ? 1 : -1; s.out = 33.4 + (STROKES.length - 1 - j) * .035; });
const TITLE_HIT = 28.3;

/* ---------- timeline ---------- */
const SCENES = [[0, '01', 'SYSTEM BOOT'], [3.5, '02', 'GEAR TRAIN ASSEMBLY'], [12, '03', 'EXPLODED VIEW / CORE STACK'], [19, '04', 'APERTURE + ACTUATORS'], [25.5, '05', 'KINETIC CORE ONLINE']];
const K_RPM = [[0,0],[3.6,0],[12,3400],[17.6,7600],[21,9800],[28.3,12000],[33.5,12000],[35,0]];
const K_TQ  = [[0,0],[3.6,120],[12,1800],[17.6,3900],[28.3,4820],[33.5,4820],[35,0]];
const K_TMP = [[0,21],[12,48],[17.6,88],[21,96],[28.3,104],[36,60]];
const K_HYD = [[0,0],[21.6,4],[24,31.5],[28.3,35],[33.5,35],[35,0]];
const dimE = t => t < 25.5 ? 1 : t < 33.6 ? lerp(1, .34, eIOC(seg(t, 25.5, 26.6))) : lerp(.34, .8, seg(t, 33.6, 34.6));

let labels = [];

/* ---------- scene: grid + blueprint ---------- */
function drawGrid(t) {
  const p = eOC(seg(t, .7, 2.8));
  const fade = (1 - .55 * seg(t, 12, 13.5)) * (1 - .45 * seg(t, 25, 27));
  if (p <= 0) return;
  const L = 1700 * p, step = 100;
  ctx.lineWidth = 1;
  for (const major of [false, true]) {
    ctx.beginPath();
    for (let i = -17; i <= 17; i++) {
      if ((i % 5 === 0) !== major) continue;
      const v = i * step; if (Math.abs(v) >= L) continue;
      const h = Math.sqrt(L * L - v * v);
      P(v, -h, 0); ctx.moveTo(_x, _y); P(v, h, 0); ctx.lineTo(_x, _y);
      P(-h, v, 0); ctx.moveTo(_x, _y); P(h, v, 0); ctx.lineTo(_x, _y);
    }
    ctx.strokeStyle = rgba(major ? cSTEEL : cSTEEL, (major ? .26 : .085) * fade);
    ctx.stroke();
  }
  // edge glow of expanding grid front
  if (p < 1) { ctx.beginPath(); circ(0, 0, 0, L, 128); ctx.strokeStyle = rgba(cLINE, .5 * (1 - p)); ctx.lineWidth = 1.5; ctx.stroke(); }
}

function drawBlueprint(t) {
  const fade = 1 - seg(t, 4.6, 5.6);
  if (t < 1.3 || fade <= 0) return;
  const items = [
    { r: 180,   a: 1.5, b: 2.4, col: cHOT,  dash: [6, 5], w: 1.2 },
    { r: 190,   a: 1.7, b: 2.6, col: cLINE, w: 1 },
    { r: 167.5, a: 1.9, b: 2.8, col: cSTEEL, w: 1 },
    { r: 62,    a: 2.1, b: 2.8, col: cSTEEL, w: 1 },
  ];
  for (const it of items) {
    const p = eOC(seg(t, it.a, it.b)); if (p <= 0) continue;
    ctx.beginPath(); arc(0, 0, 0, it.r, -Math.PI / 2, -Math.PI / 2 + TAU * p, Math.max(4, Math.round(120 * p)));
    ctx.strokeStyle = rgba(it.col, .9 * fade); ctx.lineWidth = it.w; ctx.setLineDash(it.dash || []); ctx.stroke(); ctx.setLineDash([]);
  }
  const cl = eOC(seg(t, 1.4, 2.0)) * 280;
  ctx.beginPath(); P(-cl, 0, 0); ctx.moveTo(_x, _y); P(cl, 0, 0); ctx.lineTo(_x, _y); P(0, -cl, 0); ctx.moveTo(_x, _y); P(0, cl, 0); ctx.lineTo(_x, _y);
  ctx.strokeStyle = rgba(cHOT, .55 * fade); ctx.setLineDash([14, 4, 2, 4]); ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
  const la = seg(t, 2.4, 2.8) * fade;
  if (la > 0) {
    P(180 * Math.cos(-.62), 180 * Math.sin(-.62), 0); labels.push({ x: _x, y: _y, a: la, lines: ['PCD Ø360', 'm10 · Z36 · α20°'], hot: true });
    P(190 * Math.cos(2.3), 190 * Math.sin(2.3), 0); labels.push({ x: _x, y: _y, a: la, lines: ['OD Ø380'], side: -1 });
  }
}

/* ---------- scene: gear train ---------- */
function drawGears(t) {
  if (t < 3.5 || t > 13.5) return;
  const tau = Math.max(0, t - 3.6);
  for (const g of GEARS) {
    if (g.p < 0) { g.th0 = .4 * tau + .06 * tau * tau; g.w = .4 + .12 * tau; }
    else { const q = GEARS[g.p]; g.th0 = g.phi + Math.PI + (g.phi - q.th0) * q.N / g.N - Math.PI / g.N; g.w = -q.w * q.N / g.N; }
  }
  const ex = eIC(seg(t, 12, 13.4)), blue = 1 - seg(t, 8, 9.5);
  const list = [];
  for (const g of GEARS) {
    let sc = 1, alpha = 1, Z = 0, reveal = 1, fillA = 1;

[1.5, 1.7, 1.9].forEach(x => ev(x, 'tick', .6));
ev(3.6, 'whir', .8, 1.3, 60, 240); ev(4.5, 'clunk', .7);
GEARS.forEach(g => { if (g.p >= 0) { ev(g.ap + .42, 'clunk', .75); ev(g.ap + .44, 'tick', .7); } });
ev(8.0, 'whir', 1, 2.4, 50, 300);
ev(12.0, 'hiss', 1); ev(12.0, 'whir', .8, 1.2, 300, 90);
RINGS.forEach((r, i) => { ev(12.5 + i * .17 + .45, 'tick', .8); ev(12.5 + i * .17 + .45, 'clunk', .3); });
ev(16.0, 'riser', 1, 1.6); ev(17.6, 'boom', 1);
ev(19.3, 'whir', .7, 1.1, 80, 520); ev(20.6, 'clunk', .6); ev(21.0, 'boom', .45); ev(21.0, 'hiss', .8);
for (let j = 0; j < 8; j++) { ev(21.8 + j * .16, 'hiss', .7); ev(21.8 + j * .16 + .38, 'clunk', .45); }
ev(24.4, 'clunk', 1); ev(24.42, 'tick', 1);
ev(25.5, 'whir', .6, 1.0, 400, 80);
STROKES.forEach(s => ev(s.land, 'tick', .9));
ev(26.6, 'riser', 1.1, 1.7); ev(TITLE_HIT, 'boom', 1.1);
for (let x = 28.8; x < 30.6; x += .22) ev(x, 'beep', .35, 1980);
[30.2, 30.6, 31.0].forEach(x => ev(x, 'beep', .5, 990));
ev(33.4, 'whir', .7, 1.2, 380, 60); STROKES.forEach(s => ev(s.out + .1, 'tick', .45));
ev(35.0, 'tick', 1); ev(35.45, 'beep', .7, 440);
EV.sort((a, b) => a.t - b.t);
function fire(a, b) { if (!AC || !soundOn) return; for (const e of EV) if (e.t > a && e.t <= b) SFX[e.fn](...e.args); }
function audioFrame(t) {
  if (!AC) return;
  const now = AC.currentTime, live = soundOn && playing;
  out.gain.setTargetAtTime(live ? .85 : 0, now, .05);
  const r = kf(K_RPM, t) / 12000;
  droneF.frequency.setTargetAtTime(140 + r * 900, now, .1);
  droneO.forEach(([o, f]) => o.frequency.setTargetAtTime(f * (1 + r * .6), now, .1));
  droneG.gain.setTargetAtTime(t > 35 || t < .5 ? 0 : .05 + .05 * r, now, .2);
}

/* ---------- transport ---------- */
const ui = document.getElementById('ui'), bPlay = document.getElementById('play'), bRe = document.getElementById('restart'),
      bSnd = document.getElementById('snd'), bFs = document.getElementById('fs'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
const marks = document.getElementById('marks');
SCENES.forEach(s => { const sp = document.createElement('span'); sp.style.left = (s[0] / T * 100) + '%'; sp.textContent = s[1]; marks.appendChild(sp); });

const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let t = reduce ? 29.8 : 0, playing = !reduce, last = performance.now(), scrubbing = false, idleTimer = 0;
function setPlaying(p) { playing = p; bPlay.textContent = p ? 'Pause' : 'Play'; bPlay.setAttribute('aria-pressed', String(p)); poke(); }
setPlaying(playing);
bPlay.addEventListener('click', () => setPlaying(!playing));
bRe.addEventListener('click', () => { t = 0; setPlaying(true); });
bSnd.addEventListener('click', () => {
  try { if (!AC) audioInit(); AC.resume && AC.resume(); } catch (e) { bSnd.textContent = 'No audio'; return; }
  soundOn = !soundOn; bSnd.textContent = soundOn ? 'Sound off' : 'Sound on'; bSnd.setAttribute('aria-pressed', String(soundOn)); bSnd.classList.remove('hot');
});
bFs.addEventListener('click', () => {
  const d = document;
  try {
    if (d.fullscreenElement) d.exitFullscreen().catch(() => {});
    else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
});
scrub.addEventListener('input', () => { t = scrub.value / 1000; scrubbing = true; poke(); });
scrub.addEventListener('change', () => { scrubbing = false; });
C.addEventListener('click', () => setPlaying(!playing));
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'm' || e.key === 'M') bSnd.click();
  else if (e.key === 'ArrowRight') { t = Math.min(T - .01, t + 2); poke(); }
  else if (e.key === 'ArrowLeft') { t = Math.max(0, t - 2); poke(); }
});

function poke() { ui.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (playing && !ui.matches(':hover') && !ui.contains(document.activeElement)) ui.classList.add('idle'); }, 3200); }
['pointermove', 'pointerdown', 'touchstart'].forEach(n => window.addEventListener(n, poke, { passive: true }));
poke();

window.__seek = v => { t = v; setPlaying(false); render(t); };

function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing && !scrubbing) {
    const pt = t; t += dt;
    if (t >= T) { fire(pt, T); t -= T; fire(-1, t); } else fire(pt, t);
  }
  render(t);
  audioFrame(t);
  if (!scrubbing) scrub.value = String(Math.round(t * 1000));
  tcEl.textContent = `${t.toFixed(1).padStart(4, '0')} / ${T.toFixed(1)}`;
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) { document.fonts.load(`700 15px ${F_DISP}`); document.fonts.load(`500 11px ${F_MONO}`); }
requestAnimationFrame(frame);
})();
</script>
